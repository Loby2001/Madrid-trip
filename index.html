<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Madrid Trip</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0392b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #7a7a7a;
    --accent: #c0392b;
    --border: #e6e0d6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 16px 10px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    z-index: 500;
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 1.25rem;
    letter-spacing: 0.3px;
  }
  #filters {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }
  #filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.82rem;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #map { flex: 1; width: 100%; }
  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .popup-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; }
  .popup-notes { font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
  .popup-link {
    display: inline-block;
    font-size: 0.8rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .divmarker {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  .divmarker span {
    transform: rotate(45deg);
    font-size: 15px;
  }
</style>
</head>
<body>

<header>
  <h1>🇪🇸 Madrid</h1>
  <div id="filters"></div>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const categories = {
  visite:  { label: "Da visitare", color: "#2c7a4b", icon: "🏛️" },
  musei:   { label: "Musei",       color: "#7d3c98", icon: "🖼️" },
  mercati: { label: "Mercati",     color: "#d68910", icon: "🧺" },
  cibo:    { label: "Da mangiare", color: "#c0392b", icon: "🍽️" },
  rooftop: { label: "Rooftop",     color: "#2471a3", icon: "🌇" }
};

const places = [
  { name: "Rastro de Madrid", cat: "visite", lat: 40.4069918, lng: -3.7072631, notes: "Solo domenica mattina, 9:00–15:00", url: "https://maps.google.com/?cid=16700442123469713193" },
  { name: "Real Jardín Botánico", cat: "visite", lat: 40.4111064, lng: -3.6911267, notes: "", url: "https://maps.google.com/?cid=2988562595207627051" },
  { name: "Palacio de Cristal (Retiro)", cat: "visite", lat: 40.4136352, lng: -3.6819997, notes: "In restauro fino al 2027, esterno visitabile", url: "https://maps.google.com/?cid=8767359853343406681" },
  { name: "Rosaleda (Retiro)", cat: "visite", lat: 40.4107901, lng: -3.6803226, notes: "", url: "https://maps.google.com/?cid=8660068020181941346" },
  { name: "Gran Vía", cat: "visite", lat: 40.418946, lng: -3.6969034, notes: "", url: "https://maps.google.com/?cid=16220066372150648097" },
  { name: "Plaza de España", cat: "visite", lat: 40.4236051, lng: -3.7132356, notes: "", url: "https://maps.google.com/?cid=2625728932547877739" },
  { name: "Plaza de Cibeles", cat: "visite", lat: 40.4193432, lng: -3.6930919, notes: "", url: "https://maps.google.com/?cid=7661895637218684328" },
  { name: "Palacio Real", cat: "visite", lat: 40.417955, lng: -3.714312, notes: "", url: "https://maps.google.com/?cid=3350656655825979473" },
  { name: "Catedral de la Almudena", cat: "visite", lat: 40.415651, lng: -3.714552, notes: "", url: "https://maps.google.com/?cid=9213498426296544370" },
  { name: "Jardines de Sabatini", cat: "visite", lat: 40.420332, lng: -3.714004, notes: "", url: "https://maps.google.com/?cid=985833554452522769" },
  { name: "Templo de Debod", cat: "visite", lat: 40.4240216, lng: -3.7177695, notes: "Ottimo per il tramonto", url: "https://maps.google.com/?cid=2119746020307306155" },
  { name: "Barrio de las Letras", cat: "visite", lat: 40.4146577, lng: -3.6995554, notes: "", url: "https://maps.google.com/?cid=11991760562424641340" },
  { name: "Plaza del Dos de Mayo (Malasaña)", cat: "visite", lat: 40.4267066, lng: -3.7041056, notes: "", url: "https://maps.google.com/?cid=7414420717757750733" },
  { name: "Plaza de Chueca", cat: "visite", lat: 40.4229141, lng: -3.6976142, notes: "", url: "https://maps.google.com/?cid=2534923452383342492" },

  { name: "Museo Reina Sofía", cat: "musei", lat: 40.4079123, lng: -3.6945569, notes: "Guernica — priorità se hai poco tempo", url: "https://maps.google.com/?cid=3501571599666691953" },
  { name: "Museo del Prado", cat: "musei", lat: 40.4137818, lng: -3.6921271, notes: "", url: "https://maps.google.com/?cid=1194844223299225690" },
  { name: "Fundación Telefónica", cat: "musei", lat: 40.420392, lng: -3.7017747, notes: "Mostre brevi, entrata gratuita", url: "https://maps.google.com/?cid=807211926029384807" },

  { name: "Mercado de San Miguel", cat: "mercati", lat: 40.4153794, lng: -3.7089697, notes: "Bello ma turistico e caro: guarda, non mangiare qui", url: "https://maps.google.com/?cid=1598750187957883112" },
  { name: "Mercado de San Antón", cat: "mercati", lat: 40.4220799, lng: -3.6976883, notes: "", url: "https://maps.google.com/?cid=16243578547933207371" },
  { name: "Mercado de la Cebada", cat: "mercati", lat: 40.4109912, lng: -3.7098772, notes: "", url: "https://maps.google.com/?cid=16551212844072139728" },
  { name: "Mercado de la Paz", cat: "mercati", lat: 40.4273724, lng: -3.6857317, notes: "Qui dentro c'è Casa Dani", url: "https://maps.google.com/?cid=13125232114724369265" },

  { name: "Chocolatería San Ginés", cat: "cibo", lat: 40.4167385, lng: -3.7069356, notes: "Churros con chocolate, aperto 24h", url: "https://maps.google.com/?cid=7536165071040463829" },
  { name: "Casa Julio", cat: "cibo", lat: 40.4242824, lng: -3.703693, notes: "Croquetas, niente prenotazioni", url: "https://maps.google.com/?cid=16189146551624302791" },
  { name: "Casa Macareno", cat: "cibo", lat: 40.4259636, lng: -3.7047437, notes: "", url: "https://maps.google.com/?cid=3066449188113516800" },
  { name: "El Viajero", cat: "cibo", lat: 40.4116602, lng: -3.710201, notes: "", url: "https://maps.google.com/?cid=1892470673665106958" },
  { name: "En Bruto", cat: "cibo", lat: 40.423743, lng: -3.6959626, notes: "Colazione / caffè", url: "https://maps.google.com/?cid=14426815768135673231" },
  { name: "La Desayunería", cat: "cibo", lat: 40.4206565, lng: -3.6981988, notes: "Colazione / caffè", url: "https://maps.google.com/?cid=7699074987834772544" },
  { name: "La Duquesita", cat: "cibo", lat: 40.4257273, lng: -3.6970027, notes: "Pasticceria", url: "https://maps.google.com/?cid=16461534772377390383" },
  { name: "Juana la Loca", cat: "cibo", lat: 40.4217767, lng: -3.6903157, notes: "Tortilla", url: "https://maps.google.com/?cid=13093614381601300813" },
  { name: "Sylkar", cat: "cibo", lat: 40.4407096, lng: -3.6973519, notes: "Tortilla — Chamberí", url: "https://maps.google.com/?cid=6278191595202166964" },
  { name: "Casa Dani", cat: "cibo", lat: 40.4270238, lng: -3.6856626, notes: "Tortilla — dentro Mercado de la Paz", url: "https://maps.google.com/?cid=15220245183242151038" },
  { name: "Tortillas de Gabino", cat: "cibo", lat: 40.4338707, lng: -3.6938244, notes: "Tortilla — Chamberí", url: "https://maps.google.com/?cid=17467081702055343602" },
  { name: "La Buganvilla", cat: "cibo", lat: 40.4287522, lng: -3.6943202, notes: "Paella", url: "https://maps.google.com/?cid=17440102743508487808" },
  { name: "Malacatín", cat: "cibo", lat: 40.4103131, lng: -3.7076678, notes: "Cocido — meglio prenotare", url: "https://maps.google.com/?cid=7569528127333161007" },
  { name: "El Niño Pastor", cat: "cibo", lat: 40.4349182, lng: -3.7062846, notes: "Chamberí — caña", url: "https://maps.google.com/?cid=3128423407182597971" },

  { name: "Azotea Círculo de Bellas Artes", cat: "rooftop", lat: 40.4183253, lng: -3.6964847, notes: "", url: "https://maps.google.com/?cid=18166289851535626406" },
  { name: "Hotel RIU Plaza España (360º)", cat: "rooftop", lat: 40.4242145, lng: -3.7107177, notes: "", url: "https://maps.google.com/?cid=2057204258020788617" },
  { name: "Azotea Ayuntamiento (Palacio de Cibeles)", cat: "rooftop", lat: 40.4188537, lng: -3.6919631, notes: "", url: "https://maps.google.com/?cid=8332515814831486300" },
  { name: "ABC Serrano", cat: "rooftop", lat: 40.4321406, lng: -3.6870326, notes: "Non per la vista, ma per bere qualcosa", url: "https://maps.google.com/?cid=16201059378273631091" }
];

const map = L.map('map', { zoomControl: false }).setView([40.4189, -3.7040], 14);
L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function makeIcon(cat) {
  const c = categories[cat];
  return L.divIcon({
    className: '',
    html: `<div class="divmarker" style="background:${c.color}"><span>${c.icon}</span></div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -28]
  });
}

const layers = {};
Object.keys(categories).forEach(cat => { layers[cat] = L.layerGroup().addTo(map); });

places.forEach(p => {
  const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.cat) });
  const notesHtml = p.notes ? `<div class="popup-notes">${p.notes}</div>` : '';
  marker.bindPopup(
    `<div class="popup-title">${p.name}</div>${notesHtml}<a class="popup-link" href="${p.url}" target="_blank" rel="noopener">Apri in Google Maps ↗</a>`
  );
  marker.addTo(layers[p.cat]);
});

const filtersEl = document.getElementById('filters');
const allChip = document.createElement('button');
allChip.className = 'chip active';
allChip.textContent = 'Tutti';
filtersEl.appendChild(allChip);

const chipEls = {};
Object.entries(categories).forEach(([key, c]) => {
  const chip = document.createElement('button');
  chip.className = 'chip active';
  chip.textContent = `${c.icon} ${c.label}`;
  chip.dataset.cat = key;
  filtersEl.appendChild(chip);
  chipEls[key] = chip;
});

function updateAllChipState() {
  const allActive = Object.values(chipEls).every(c => c.classList.contains('active'));
  allChip.classList.toggle('active', allActive);
}

allChip.addEventListener('click', () => {
  const turnOn = !allChip.classList.contains('active');
  Object.entries(chipEls).forEach(([key, chip]) => {
    if (turnOn) {
      chip.classList.add('active');
      map.addLayer(layers[key]);
    } else {
      chip.classList.remove('active');
      map.removeLayer(layers[key]);
    }
  });
  allChip.classList.toggle('active', turnOn);
});

Object.entries(chipEls).forEach(([key, chip]) => {
  chip.addEventListener('click', () => {
    const active = chip.classList.toggle('active');
    if (active) { map.addLayer(layers[key]); } else { map.removeLayer(layers[key]); }
    updateAllChipState();
  });
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
